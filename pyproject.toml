[project]
name = "arithmp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Mikaël Capelle", email = "capelle.mikael@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "lark>=1.3.1",
]

[project.scripts]
arithmp = "arithmp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "poethepoet>=0.49.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.poe.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "ty check ."
check = ["lint", "format-check", "typecheck"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]  # Erreurs pycodestyle, Pyflakes, et tri des imports (isort)
ignore = ["E501"]
